<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anastasia Ovsyannikova — Product Designer</title>
  <meta name="description" content="Senior Product Designer with 8+ years of experience in B2B, enterprise, and internal products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="site-logo">Anastasia Ovsyannikova</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="#projects" data-i18n="nav.projects">Projects</a>
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
        <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
          <span class="lang-toggle__en" data-lang-btn="en">EN</span>
          <span class="lang-toggle__sep">/</span>
          <span class="lang-toggle__ru" data-lang-btn="ru">RU</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container">
      <h1 class="hero__title" data-i18n="hero.title">Product Design for complex systems</h1>
      <p class="hero__subtitle">
        <span data-i18n="hero.subtitle_1">Simplifying B2B complexity.</span>
        <span data-i18n="hero.subtitle_2">Designing platform systems.</span>
        <span data-i18n="hero.subtitle_3">Shipping enterprise UX.</span>
      </p>
      <p class="hero__background mono" data-i18n="hero.background">Currently at Kaspersky, designing XDR & SIEM.</p>
      <div class="hero__cta">
        <a href="#projects" class="btn btn--primary" data-i18n="hero.cta_primary">View my work</a>
        <a href="mailto:nastya.ovs2016@gmail.com?subject=Portfolio%20inquiry" class="btn btn--outline" data-i18n="hero.cta_secondary">Get in touch</a>
      </div>
    </section>

    <section id="projects" class="projects container">
      <p class="mono projects__label" data-i18n="projects.selected_label">Selected projects</p>
      <div class="projects__grid projects__grid--selected" id="selectedGrid" data-render="selected"></div>

      <p class="mono projects__label projects__label--other" data-i18n="projects.other_label">Other projects</p>
      <div class="projects__grid projects__grid--other" id="otherGrid" data-render="other"></div>
    </section>
  </main>
  <script src="script.js" data-base=""></script>
</body>
</html>
